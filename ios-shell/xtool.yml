version: 1
product: openGym
bundleID: ch.stanley.opengym

# xtool generates a bare-bones Info.plist (UIDeviceFamily, portrait orientation, UILaunchScreen)
# and merges this file over it. There is no storyboard: UILaunchScreen is a key, not a file, so
# the app has no Interface Builder artefacts for xtool to have to be able to compile.
infoPath: Support/Info.plist

# No actool in xtool, so the icon is a loose PNG at the bundle root rather than a compiled
# Assets.car — and xtool copies exactly ONE file for iconPath (Packer.swift:199), setting
# CFBundleIconFile to its basename. So that one file is the 1024 master and iOS scales it; the
# sized variants in Support/ and resources/ are for the web and for generating, not shipped
# inside the app. Info.plist also lists it under CFBundleIconFiles, the array form iOS reads for
# loose icons.
iconPath: Support/AppIcon.png

# Keychain access for the Coach's provider key and the Cloudflare Access token. Both are stored
# with kSecAttrAccessibleAfterFirstUnlock: the reminder schedule is written while the app is in
# the foreground and read back by UNUserNotificationCenter at fire time, which can happen with
# the device locked but not before the first unlock after boot.
entitlementsPath: Support/openGym.entitlements